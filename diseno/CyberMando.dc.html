<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #06060c; color: #e8f4ff; font-family: 'Chakra Petch', 'Trebuchet MS', sans-serif; }
    a { color: #00e5ff; } a:hover { color: #7df9ff; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    .corte { clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); }

    /* Escena: cielo arriba, horizonte al 60% de la altura y suelo en fuga.
       La rejilla del suelo se dibuja plana y se tumba con una perspectiva
       corta, que es lo que produce la fuga hacia el horizonte. */
    .escena { position: absolute; inset: 0; overflow: hidden; }
    .cielo {
      position: absolute; top: 0; left: 0; right: 0; height: 60%;
      background: radial-gradient(100% 130% at 50% 100%, var(--halo), transparent 70%);
    }
    .horizonte {
      position: absolute; top: 60%; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--linea), transparent);
      /* Tenue a propósito: con más brillo, el resplandor invade el texto que
         cae cerca del horizonte y deja de leerse. */
      opacity: 0.35;
    }
    .suelo {
      position: absolute; top: 60%; left: -60%; right: -60%; bottom: -25%;
      transform: perspective(150px) rotateX(62deg);
      transform-origin: 50% 0%;
      background-image:
        repeating-linear-gradient(90deg, var(--rejilla) 0 1px, transparent 1px 46px),
        repeating-linear-gradient(0deg, var(--rejilla) 0 1px, transparent 1px 46px);
      /* Se desvanece cerca del horizonte para que no compita con los controles. */
      -webkit-mask-image: linear-gradient(180deg, transparent, #000 22%, #000);
      mask-image: linear-gradient(180deg, transparent, #000 22%, #000);
    }
  </style>
</helmet>

<!-- Variante SNES / GBA. Los gatillos van pegados al borde superior, que es
     donde caen los índices al sujetar el móvil apaisado. -->
<div style="position: relative; width: 800px; height: 360px; box-sizing: border-box; background: #06060c; --halo: {{halo}}; --linea: {{color}}; --rejilla: {{rejilla}};">

  <div class="escena">
    <div class="cielo"></div>
    <div class="suelo"></div>
    <div class="horizonte"></div>
  </div>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 42px 28px 22px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;">

    <div class="corte" style="position: absolute; top: 0; left: 40px; width: 152px; height: 30px; background: linear-gradient(180deg, #131a2c, #0b0f1a); border-bottom: 1px solid {{color}}66; display: flex; align-items: center; justify-content: center;">
      <span class="mono" style="font-size: 11px; letter-spacing: 0.3em; color: {{color}};">L</span>
    </div>
    <div class="corte" style="position: absolute; top: 0; right: 40px; width: 152px; height: 30px; background: linear-gradient(180deg, #131a2c, #0b0f1a); border-bottom: 1px solid {{color}}66; display: flex; align-items: center; justify-content: center;">
      <span class="mono" style="font-size: 11px; letter-spacing: 0.3em; color: {{color}};">R</span>
    </div>

    <div style="position: absolute; top: 8px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 16px;">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.24em; color: {{color}}; text-shadow: 0 0 12px {{color}};">P{{jugador}}</span>
      <span class="mono" style="font-size: 10px; letter-spacing: 0.12em; color: #5b7590;">12/19 MS</span>
    </div>

    <!-- Cruceta: una sola zona táctil; la dirección sale de dónde está el dedo. -->
    <div style="justify-self: start; position: relative; width: 178px; height: 178px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #0e1626, #070b13); border: 1px solid {{color}}44; box-shadow: 0 0 30px {{color}}22, inset 0 0 40px #000;">
      <div style="position: absolute; top: 13%; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 25px solid {{color}}; filter: drop-shadow(0 0 8px {{color}});"></div>
      <div style="position: absolute; bottom: 13%; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 25px solid #1d2a3d;"></div>
      <div style="position: absolute; left: 13%; top: 50%; transform: translateY(-50%); width: 0; height: 0; border-top: 20px solid transparent; border-bottom: 20px solid transparent; border-right: 25px solid #1d2a3d;"></div>
      <div style="position: absolute; right: 13%; top: 50%; transform: translateY(-50%); width: 0; height: 0; border-top: 20px solid transparent; border-bottom: 20px solid transparent; border-left: 25px solid #1d2a3d;"></div>
      <div style="position: absolute; inset: 37%; border-radius: 50%; background: #0a0f1a; border: 1px solid {{color}}33;"></div>
    </div>

    <!-- Zona muerta central: aquí se apoyan las manos y vive la barra de gestos. -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 16px;">
      <div style="display: flex; gap: 8px;">
        <button class="corte" style="padding: 9px 15px; border: none; background: #131a2c; color: #8aa6c2; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em;">SELECT</button>
        <button class="corte" style="padding: 9px 15px; border: none; background: #131a2c; color: #8aa6c2; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em;">START</button>
      </div>
      <div style="display: flex; gap: 6px;">
        <span class="mono" style="font-size: 9px; letter-spacing: 0.12em; color: #5b7590; border: 1px solid #1d2a3d; padding: 5px 9px;">GUARDAR</span>
        <span class="mono" style="font-size: 9px; letter-spacing: 0.12em; color: #5b7590; border: 1px solid #1d2a3d; padding: 5px 9px;">SALA</span>
      </div>
    </div>

    <!-- Rombo de acciones. Los botones se separan lo suficiente para que un
         pulgar no roce dos a la vez. -->
    <div style="justify-self: end; position: relative; width: 214px; height: 214px;">
      <sc-for list="{{acciones}}" as="b" hint-placeholder-count="4">
        <button style="{{b.estilo}}">{{b.letra}}</button>
      </sc-for>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"jugador":{"editor":"enum","options":["1","2","3","4"],"default":"1","section":"Mando"}}'>
class Component extends DCLogic {
  renderVals() {
    const colores = { 1: '#ff2e6a', 2: '#00e5ff', 3: '#39ff7a', 4: '#ffb300' };
    const jugador = String(this.props.jugador ?? '1');
    const color = colores[jugador] || colores[1];

    // Rombo de 214 px con botones de 68: quedan ~32 px de aire entre bordes,
    // frente a los 2 px de la versión anterior.
    const D = 214;
    const TAM = 68;
    const off = (D - TAM) / 2;
    const base =
      `position: absolute; width: ${TAM}px; height: ${TAM}px; border-radius: 50%;` +
      'font-family: Chakra Petch, sans-serif; font-size: 24px; font-weight: 700;';
    const neutro = `${base} background: #0e1626; border: 1px solid #22304a; color: #8aa6c2;`;
    const vivo =
      `${base} background: #0e1626; border: 1px solid ${color}; color: ${color};` +
      `box-shadow: 0 0 22px ${color}55, inset 0 0 18px ${color}22; text-shadow: 0 0 12px ${color};`;

    const acciones = [
      { letra: 'X', estilo: `${neutro} top: 0; left: ${off}px;` },
      { letra: 'Y', estilo: `${neutro} top: ${off}px; left: 0;` },
      { letra: 'A', estilo: `${vivo} top: ${off}px; right: 0;` },
      { letra: 'B', estilo: `${vivo} bottom: 0; left: ${off}px;` }
    ];

    return {
      jugador,
      color,
      acciones,
      halo: `${color}26`,
      // La rejilla toma el color del jugador, muy rebajado: da profundidad sin
      // robarle contraste a los controles.
      rejilla: `${color}3d`
    };
  }
}
</script>
</body>
</html>
