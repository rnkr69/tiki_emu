<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #0c0c10; color: #f4f4f6; font-family: 'Space Grotesk', 'Trebuchet MS', sans-serif; }
    a { color: #74c0fc; } a:hover { color: #a5d8ff; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  </style>
</helmet>

<!-- Variante SNES / GBA: cuatro botones en rombo y gatillos. Los gatillos van
     pegados al borde superior, que es donde caen los índices al sujetar el
     móvil apaisado, y respetan el hueco de la muesca en los laterales. -->
<div style="position: relative; width: 800px; height: 360px; box-sizing: border-box; padding: 40px 30px 26px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: {{fondo}};">

  <!-- Gatillos -->
  <div style="position: absolute; top: 0; left: 46px; width: 138px; height: 30px; border-radius: 0 0 14px 14px; background: #23232c; box-shadow: inset 0 -3px 0 #00000066; display: flex; align-items: center; justify-content: center;">
    <span class="mono" style="font-size: 12px; letter-spacing: 0.16em; color: #ced4da;">L</span>
  </div>
  <div style="position: absolute; top: 0; right: 46px; width: 138px; height: 30px; border-radius: 0 0 14px 14px; background: #23232c; box-shadow: inset 0 -3px 0 #00000066; display: flex; align-items: center; justify-content: center;">
    <span class="mono" style="font-size: 12px; letter-spacing: 0.16em; color: #ced4da;">R</span>
  </div>

  <div style="position: absolute; top: 8px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 14px;">
    <span class="mono" style="font-size: 11px; font-weight: 500; letter-spacing: 0.12em; color: {{color}};">JUGADOR {{jugador}}</span>
    <span class="mono" style="font-size: 10px; color: #4d5157;">12/19 ms</span>
  </div>

  <!-- Cruceta -->
  <div style="justify-self: start; position: relative; width: 176px; height: 176px; border-radius: 50%; background: #15151b; border: 2px solid #26262f; box-shadow: inset 0 4px 14px #00000080;">
    <div style="position: absolute; top: 14%; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 19px solid transparent; border-right: 19px solid transparent; border-bottom: 24px solid {{color}};"></div>
    <div style="position: absolute; bottom: 14%; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 19px solid transparent; border-right: 19px solid transparent; border-top: 24px solid #3d4046;"></div>
    <div style="position: absolute; left: 14%; top: 50%; transform: translateY(-50%); width: 0; height: 0; border-top: 19px solid transparent; border-bottom: 19px solid transparent; border-right: 24px solid #3d4046;"></div>
    <div style="position: absolute; right: 14%; top: 50%; transform: translateY(-50%); width: 0; height: 0; border-top: 19px solid transparent; border-bottom: 19px solid transparent; border-left: 24px solid #3d4046;"></div>
    <div style="position: absolute; inset: 36%; border-radius: 50%; background: #1d1d25; border: 1px solid #2b2b34;"></div>
  </div>

  <!-- Centro: zona muerta, sin nada que se pueda pulsar sin querer. -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 0 20px;">
    <div style="display: flex; gap: 8px;">
      <button style="padding: 8px 16px; border: none; border-radius: 18px; background: #23232c; color: #ced4da; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.12em; box-shadow: inset 0 -2px 0 #00000055;">SELECT</button>
      <button style="padding: 8px 16px; border: none; border-radius: 18px; background: #23232c; color: #ced4da; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.12em; box-shadow: inset 0 -2px 0 #00000055;">START</button>
    </div>
    <div style="display: flex; gap: 6px;">
      <span class="mono" style="font-size: 9px; letter-spacing: 0.1em; color: #6c757d; border: 1px solid #2f3238; border-radius: 14px; padding: 5px 9px;">GUARDAR</span>
      <span class="mono" style="font-size: 9px; letter-spacing: 0.1em; color: #6c757d; border: 1px solid #2f3238; border-radius: 14px; padding: 5px 9px;">SALA</span>
    </div>
  </div>

  <!-- Cuatro botones en rombo, como el mando de SNES. -->
  <div style="justify-self: end; position: relative; width: 180px; height: 180px;">
    <sc-for list="{{acciones}}" as="b" hint-placeholder-count="4">
      <button style="{{b.estilo}}">{{b.letra}}</button>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"jugador":{"editor":"enum","options":["1","2","3","4"],"default":"1","section":"Mando"}}'>
class Component extends DCLogic {
  renderVals() {
    const colores = { 1: '#f03e3e', 2: '#1c7ed6', 3: '#37b24d', 4: '#f59f00' };
    const jugador = String(this.props.jugador ?? '1');
    const color = colores[jugador] || colores[1];

    // Colores del rombo: los cuatro botones de SNES se distinguían por color.
    // Aquí el par principal (A/B) lleva el color del jugador y el secundario
    // (X/Y) queda neutro, para que la mano encuentre A sin mirar.
    const base =
      'position: absolute; width: 74px; height: 74px; border: none; border-radius: 50%;' +
      'font-family: Space Grotesk, sans-serif; font-size: 26px; font-weight: 700; color: #fff;' +
      'box-shadow: inset 0 -4px 0 #00000055;';
    const acciones = [
      { letra: 'X', pos: 'top: 0; left: 53px;', fondo: '#23232c' },
      { letra: 'Y', pos: 'top: 53px; left: 0;', fondo: '#23232c' },
      { letra: 'A', pos: 'top: 53px; right: 0;', fondo: color },
      { letra: 'B', pos: 'bottom: 0; left: 53px;', fondo: color }
    ].map((b) => ({ ...b, estilo: `${base} ${b.pos} background: ${b.fondo};` }));

    return {
      jugador,
      color,
      acciones,
      fondo: `radial-gradient(120% 90% at 50% 0%, ${color}14, #0c0c10 60%)`
    };
  }
}
</script>
</body>
</html>
