<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <style>
    body { margin: 0; background: #101018; color: #fcfcfc; font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    a { color: #3cbcfc; } a:hover { color: #a8e0fc; }
    /* Tipografía de mapa de bits solo en rótulos cortos: en textos largos
       se vuelve ilegible a esta distancia. */
    .bits { font-family: 'Press Start 2P', 'IBM Plex Mono', monospace; }
    /* Bisel de píxel: sombras duras, sin desenfoque, como un sprite. */
    .bisel { box-shadow: inset -4px -4px 0 #00000066, inset 4px 4px 0 #ffffff1f; }
  </style>
</helmet>

<div style="position: relative; width: 800px; height: 360px; box-sizing: border-box; padding: 44px 26px 24px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: #101018;">

  <!-- Gatillos: bloques rectos, sin curvas. -->
  <div class="bisel" style="position: absolute; top: 0; left: 40px; width: 150px; height: 30px; background: #4c4c68; display: flex; align-items: center; justify-content: center;">
    <span class="bits" style="font-size: 11px; color: #fcfcfc;">L</span>
  </div>
  <div class="bisel" style="position: absolute; top: 0; right: 40px; width: 150px; height: 30px; background: #4c4c68; display: flex; align-items: center; justify-content: center;">
    <span class="bits" style="font-size: 11px; color: #fcfcfc;">R</span>
  </div>

  <div style="position: absolute; top: 9px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 16px;">
    <span class="bits" style="font-size: 9px; color: {{color}};">P{{jugador}}</span>
    <span style="font-size: 11px; color: #6c6c84; letter-spacing: 0.1em;">12/19 MS</span>
  </div>

  <!-- Cruceta de cruz recta, como la de un mando de 8 bits. -->
  <div style="justify-self: start; position: relative; width: 168px; height: 168px;">
    <div class="bisel" style="position: absolute; left: 56px; top: 0; width: 56px; height: 168px; background: #2c2c44;"></div>
    <div class="bisel" style="position: absolute; top: 56px; left: 0; width: 168px; height: 56px; background: #2c2c44;"></div>
    <div style="position: absolute; left: 56px; top: 0; width: 56px; height: 56px; background: {{color}};"></div>
    <div style="position: absolute; left: 66px; top: 66px; width: 36px; height: 36px; background: #1a1a28;"></div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 18px;">
    <div style="display: flex; gap: 8px;">
      <button class="bisel" style="padding: 9px 13px; border: none; background: #4c4c68; color: #fcfcfc; font-family: 'Press Start 2P', monospace; font-size: 7px;">SELECT</button>
      <button class="bisel" style="padding: 9px 13px; border: none; background: #4c4c68; color: #fcfcfc; font-family: 'Press Start 2P', monospace; font-size: 7px;">START</button>
    </div>
    <div style="display: flex; gap: 6px;">
      <span style="font-size: 10px; letter-spacing: 0.08em; color: #6c6c84; border: 2px solid #2c2c44; padding: 5px 8px;">GUARDAR</span>
      <span style="font-size: 10px; letter-spacing: 0.08em; color: #6c6c84; border: 2px solid #2c2c44; padding: 5px 8px;">SALA</span>
    </div>
  </div>

  <!-- Rombo de cuatro botones, cuadrados y con bisel de sprite. -->
  <div style="justify-self: end; position: relative; width: 176px; height: 176px;">
    <sc-for list="{{acciones}}" as="b" hint-placeholder-count="4">
      <button class="bisel" style="{{b.estilo}}">{{b.letra}}</button>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"jugador":{"editor":"enum","options":["1","2","3","4"],"default":"1","section":"Mando"}}'>
class Component extends DCLogic {
  renderVals() {
    // Paleta tomada de la NES: colores planos y saturados, sin medios tonos.
    const colores = { 1: '#d82800', 2: '#0058f8', 3: '#00a844', 4: '#f8b800' };
    const jugador = String(this.props.jugador ?? '1');
    const color = colores[jugador] || colores[1];

    const base =
      'position: absolute; width: 72px; height: 72px; border: none;' +
      'font-family: Press Start 2P, monospace; font-size: 16px; color: #fcfcfc;';
    const acciones = [
      { letra: 'X', pos: 'top: 0; left: 52px;', fondo: '#4c4c68' },
      { letra: 'Y', pos: 'top: 52px; left: 0;', fondo: '#4c4c68' },
      { letra: 'A', pos: 'top: 52px; right: 0;', fondo: color },
      { letra: 'B', pos: 'bottom: 0; left: 52px;', fondo: color }
    ].map((b) => ({ ...b, estilo: `${base} ${b.pos} background: ${b.fondo};` }));

    return { jugador, color, acciones };
  }
}
</script>
</body>
</html>
