<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #06060c; color: #e8f4ff; font-family: 'Chakra Petch', 'Trebuchet MS', sans-serif; }
    a { color: #00e5ff; } a:hover { color: #7df9ff; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    .corte { clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); }
    @keyframes latido { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .latido { animation: latido 1.4s ease-in-out infinite; }
    .suelo-mini {
      position: absolute; top: 60%; left: -80%; right: -80%; bottom: -30%;
      transform: perspective(120px) rotateX(62deg); transform-origin: 50% 0%;
      background-image:
        repeating-linear-gradient(90deg, var(--rejilla) 0 1px, transparent 1px 40px),
        repeating-linear-gradient(0deg, var(--rejilla) 0 1px, transparent 1px 40px);
      -webkit-mask-image: linear-gradient(180deg, transparent, #000 25%, #000);
      mask-image: linear-gradient(180deg, transparent, #000 25%, #000);
    }
  </style>
</helmet>

<!-- Los cuatro estados juntos, para juzgarlos como familia: mismo esqueleto,
     cambia el color del aviso y si hay salida o no. -->
<div style="width: 800px; height: 620px; box-sizing: border-box; padding: 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; background: #06060c;">

  <sc-for list="{{estados}}" as="e" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column;">
      <span class="mono" style="font-size: 9px; letter-spacing: 0.16em; color: #33465e; margin-bottom: 6px;">{{e.rotulo}}</span>
      <div class="corte" style="{{e.marco}}">
        <div class="suelo-mini" style="{{e.suelo}}"></div>
        <div style="{{e.linea}}"></div>
        <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 13px; text-align: center;">
          <div style="{{e.icono}}">
            <span style="font-size: 21px; line-height: 1;">{{e.simbolo}}</span>
          </div>
          <h2 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0.1em;">{{e.titulo}}</h2>
          <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #7f97b0; max-width: 240px;">{{e.texto}}</p>
          <sc-if value="{{e.accion}}" hint-placeholder-val="{{ true }}">
            <button class="corte" style="{{e.botonEstilo}}">{{e.accion}}</button>
          </sc-if>
        </div>
      </div>
    </div>
  </sc-for>

</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const marco =
      'position: relative; overflow: hidden; flex-grow: 1; display: flex; align-items: center;' +
      'justify-content: center; padding: 26px 20px; background: #0b1220;';
    const iconoBase =
      'display: flex; align-items: center; justify-content: center; width: 48px; height: 48px;';
    const boton =
      'border: 1px solid; background: transparent; padding: 11px 22px; font-family: inherit;' +
      'font-size: 12px; font-weight: 700; letter-spacing: 0.12em; margin-top: 3px;';

    const estados = [
      {
        rotulo: 'RECONECTANDO',
        simbolo: '⟳',
        titulo: 'RECONECTANDO',
        texto: 'Se ha perdido la conexión. Vuelve sola en cuanto se recupere.',
        // Sin botón: no hay nada que el jugador pueda hacer, y un botón inútil
        // solo provoca toques nerviosos.
        accion: null,
        color: '#ffb300'
      },
      {
        rotulo: 'EXPULSADO',
        simbolo: '⊘',
        titulo: 'TE HAN SACADO',
        texto: 'El jugador 1 ha liberado tu puesto.',
        accion: 'ELEGIR OTRO',
        color: '#ff2e6a'
      },
      {
        rotulo: 'SALA LLENA',
        simbolo: '▮',
        titulo: 'SALA COMPLETA',
        texto: 'Todos los puestos están ocupados ahora mismo.',
        accion: 'VER PUESTOS',
        color: '#00e5ff'
      },
      {
        rotulo: 'SERVIDOR CAÍDO',
        simbolo: '⚡',
        titulo: 'CONSOLA APAGADA',
        texto: 'Nadie está sirviendo la partida. Pídele al anfitrión que la abra.',
        accion: null,
        color: '#5b7590'
      }
    ];

    return {
      estados: estados.map((e) => ({
        ...e,
        marco: `${marco} border: 1px solid ${e.color}44;`,
        suelo: `--rejilla: ${e.color}2e;`,
        linea: `position: absolute; top: 60%; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, ${e.color}66, transparent);`,
        icono: `${iconoBase} border: 1px solid ${e.color}66; color: ${e.color}; box-shadow: 0 0 22px ${e.color}33;` +
          (e.accion ? '' : ' animation: latido 1.4s ease-in-out infinite;'),
        botonEstilo: `${boton} border-color: ${e.color}; color: ${e.color}; box-shadow: 0 0 20px ${e.color}22;`
      }))
    };
  }
}
</script>
</body>
</html>
