<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #06060c; color: #e8f4ff; font-family: 'Chakra Petch', 'Trebuchet MS', sans-serif; }
    a { color: #00e5ff; } a:hover { color: #7df9ff; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    .escena { position: absolute; inset: 0; overflow: hidden; }
    .cielo { position: absolute; top: 0; left: 0; right: 0; height: 60%; background: radial-gradient(100% 120% at 50% 100%, var(--halo), transparent 70%); }
    /* Tenue a propósito: con más brillo el resplandor invade el texto cercano. */
    .horizonte { position: absolute; top: 60%; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--linea), transparent); opacity: 0.35; }
    .suelo {
      position: absolute; top: 60%; left: -120%; right: -120%; bottom: -30%;
      transform: perspective(150px) rotateX(62deg); transform-origin: 50% 0%;
      background-image:
        repeating-linear-gradient(90deg, var(--rejilla) 0 1px, transparent 1px 46px),
        repeating-linear-gradient(0deg, var(--rejilla) 0 1px, transparent 1px 46px);
      -webkit-mask-image: linear-gradient(180deg, transparent, #000 22%, #000);
      mask-image: linear-gradient(180deg, transparent, #000 22%, #000);
    }
    /* Decorativa y fuera de los controles: puede pasar de 100 ms sin leerse
       como latencia. */
    @keyframes girar {
      0%, 35% { transform: rotate(0deg); }
      55%, 100% { transform: rotate(-90deg); }
    }
    .movil { animation: girar 2.4s ease-in-out infinite; }
  </style>
</helmet>

<div style="position: relative; width: 360px; height: 800px; background: #06060c; --halo: {{halo}}; --linea: {{color}}; --rejilla: {{rejilla}};">

  <div class="escena">
    <div class="cielo"></div>
    <div class="suelo"></div>
    <div class="horizonte"></div>
  </div>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 40px 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 38px; text-align: center;">

    <div class="movil" style="width: 106px; height: 178px; border: 2px solid {{color}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 34px {{color}}55, inset 0 0 26px {{color}}1f;">
      <div style="width: 42px; height: 3px; background: {{color}}; box-shadow: 0 0 12px {{color}};"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <h1 style="margin: 0; font-size: 29px; font-weight: 700; letter-spacing: 0.12em; text-shadow: 0 0 22px {{color}}66;">GIRA EL MÓVIL</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #7f97b0;">
        El mando se sujeta en horizontal,<br>con las dos manos.
      </p>
    </div>

    <div style="display: flex; align-items: center; gap: 9px; padding: 10px 16px; border: 1px solid #1d2a3d; background: #0b1220a0;">
      <span style="width: 7px; height: 7px; background: {{color}}; box-shadow: 0 0 10px {{color}};"></span>
      <span class="mono" style="font-size: 10px; letter-spacing: 0.12em; color: #7f97b0;">P{{jugador}} · TU PUESTO SIGUE GUARDADO</span>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"jugador":{"editor":"enum","options":["1","2","3","4"],"default":"2","section":"Mando"}}'>
class Component extends DCLogic {
  renderVals() {
    const colores = { 1: '#ff2e6a', 2: '#00e5ff', 3: '#39ff7a', 4: '#ffb300' };
    const jugador = String(this.props.jugador ?? '2');
    const color = colores[jugador] || colores[1];
    return { jugador, color, halo: `${color}22`, rejilla: `${color}3d` };
  }
}
</script>
</body>
</html>
